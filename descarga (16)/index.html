<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Inscripción Escolar</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .form-container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        fieldset { border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        legend { font-weight: bold; color: #0056b3; padding: 0 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="date"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #004085; }
    </style>
<link type="text/css" rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="form-container">
    <h2>COLEGIO CTI </h2>
    
    <form action="/enviar-formulario" method="POST">
        
        <!-- Datos del Estudiante -->
        <fieldset>
            <legend>Datos del Estudiante</legend>
            
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
            </div>
            
            <div class="form-group">
                <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>
            
            <div class="form-group">
                <label>Género:</label>
                <div class="radio-group">
                    <label><input type="radio" name="genero" value="masculino" required> Masculino</label>
                    <label><input type="radio" name="genero" value="femenino"> Femenino</label>
                    <label><input type="radio" name="genero" value="otro"> Otro</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="grado">Grado al que Postula:</label>
                <select id="grado" name="grado" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="primero_primaria">1º de TECNICO OPERADOR</option>
                    <option value="segundo_primaria">2º de TECNICO PROGRANADOR</option>
                    <option value="tercero_primaria">3º de TECNICO DISEÑO GRAFICO Y SOPORTE</option>          
               </select>
            </div>
        </fieldset>

        <!-- Datos del Tutor / Responsable -->
        <fieldset>
            <legend>Datos del Padre, Madre o Tutor</legend>
            
            <div class="form-group">
                <label for="nombre_tutor">Nombre del Tutor:</label>
                <input type="text" id="nombre_tutor" name="nombre_tutor" required placeholder="Ej. María López">
            </div>
            
            <div class="form-group">
                <label for="telefono">Teléfono de Contacto:</label>
                <input type="tel" id="telefono" name="telefono" required placeholder="Ej. +52 55 1234 5678">
            </div>
            
            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required 
                       placeholder="ejemplo@correo.com">
               </div>
            
            <div class="form-group">
                <label for="CORREO">DIRECCION</label>
                <input type="EMAIL" id="CORREO" name="CORRE" required
            </div>
        </fieldset>

        <!-- Botón de Envío -->
        <button type="submit">Enviar Solicitud</button>
        
    </form>
</div>

<script type="text/javascript" src="js/script.js"></script>
</body>
</html>
